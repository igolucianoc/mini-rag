services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mini_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mini_rag}
      POSTGRES_DB: ${POSTGRES_DB:-mini_rag}
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mini_rag} -d ${POSTGRES_DB:-mini_rag}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Seed é DESTRUTIVO (reseta as tabelas de domínio antes de reinserir), então
      # NÃO roda por padrão — assim as subidas preservam os dados existentes.
      # Para popular um banco novo/demo, suba com: RUN_SEED=true docker compose up
      RUN_SEED: ${RUN_SEED:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # O preview do Vite faz proxy de /api para o service api dentro da rede.
      API_PROXY_TARGET: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '5173:5173'

volumes:
  db_data:
